[project]
name = "krystal-curator"
version = "0.1.0"
description = "Krystal LP pool screener: risk profiles, fee/turnover scoring, Bloomberg-style TUI"
readme = "README.md"
authors = [
    { name = "Dimas Victor", email = "dvictor.1357@outlook.com" }
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "textual>=8.2.8",
    "textual-image>=0.13.2",
]

[project.scripts]
krystal-curator = "krystal_curator:main"

[project.optional-dependencies]
web = [
    "aerich>=0.10.1",
    "email-validator>=2.3.0",
    "eth-account>=0.13",
    "fastapi>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "tortoise-orm[asyncpg]>=1.1.8",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.tortoise]
tortoise_orm = "krystal_curator.web_db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
