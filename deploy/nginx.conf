# /etc/nginx/sites-available/curator.conf → symlink into sites-enabled, then
# `certbot --nginx -d 187-77-128-156.sslip.io` adds the TLS block.
server {
    server_name 187-77-128-156.sslip.io;
    client_max_body_size 10m;  # browser-fed Krystal payloads

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 80;
}
